name: Generate local voice lockfile

on:
  push:
    branches:
      - fix/local-first-pwa-companion
    paths:
      - package.json
      - .github/workflows/generate-local-voice-lock.yml

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/local-first-pwa-companion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/generate-local-voice-lock.yml
          git commit -m "Lock local neural voice dependencies"
          git push origin HEAD:fix/local-first-pwa-companion
